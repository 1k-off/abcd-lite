name: Prerelease

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-[a-z0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    if: github.repository == '1k-off/abcd-lite'
    runs-on: windows-latest
    steps:
      - name: Set current date
        id: date
        run: echo "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git mingw-w64-ucrt-x86_64-gcc tar

      - name: Build Frontend
        run: |
          npm install -g pnpm
          pnpm install
          pnpm build
        working-directory: frontend
        
      - name: Cache GeoIP Database
        id: geoip-cache
        uses: actions/cache@v4
        with:
          path: geo/GeoLite2-Country.mmdb
          key: geoip-${{ runner.os }}-${{ steps.date.outputs.date }}

      - name: Download GeoIP Database
        if: steps.geoip-cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path geo
          Set-Location geo
          $credentials = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${{ secrets.MAXMIND_USERNAME }}:${{ secrets.MAXMIND_PASSWORD }}"))
          Invoke-WebRequest -Uri "https://download.maxmind.com/geoip/databases/GeoLite2-Country/download?suffix=tar.gz" -Headers @{"Authorization"="Basic $credentials"} -OutFile "GeoLite2-Country.tar.gz"
          tar -xzf GeoLite2-Country.tar.gz
          Remove-Item GeoLite2-Country.tar.gz
          Get-ChildItem -Directory -Name "GeoLite2-Country_*" | ForEach-Object { Copy-Item "$_\GeoLite2-Country.mmdb" . }
          Get-ChildItem -Directory -Name "GeoLite2-Country_*" | Remove-Item -Recurse -Force

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYGEN_ACCOUNT: ${{ secrets.KEYGEN_ACCOUNT }}
          KEYGEN_PRODUCT: ${{ secrets.KEYGEN_PRODUCT }}
          KEYGEN_PUBLIC_KEY: ${{ secrets.KEYGEN_PUBLIC_KEY }}
