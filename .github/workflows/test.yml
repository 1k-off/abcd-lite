name: Build and Test

on:
  pull_request:
  push:
    branches:
      - "*"
    tags:
      - "*"
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5
      - uses: actions/checkout@v6
      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: 22
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install -g pnpm
          pnpm install
          pnpm build
      - name: Get dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...